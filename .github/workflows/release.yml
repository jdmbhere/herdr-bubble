name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Publish Portable (Self-Contained Single-File)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/self-contained

      - name: Publish Framework-Dependent
        run: |
          dotnet publish -c Release -r win-x64 --no-self-contained `
            -o publish/framework-dependent

      - name: Package Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path publish/self-contained/* -DestinationPath dist/HerdrBubble-${{ github.ref_name }}-win-x64-standalone.zip -Force
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath dist/HerdrBubble-${{ github.ref_name }}-win-x64-dotnet7.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
